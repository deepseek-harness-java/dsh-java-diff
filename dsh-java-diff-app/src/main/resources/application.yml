server:
  port: 8098

spring:
  application:
    name: dsh-java-diff
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: non_null

dsh:
  diffnarrator:
    data-directory: ${user.home}/.dsh-java-diff
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}
